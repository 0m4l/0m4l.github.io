<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeSewing风格 参数化制版 | 宠物 / BJD /女装上衣</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{
  --primary: #6b21a8;
  --pink: #e8c8d8;
}
.tab-content{display:none;}
.tab-content.active{display:block;}
canvas{border:1px solid #ccc;background:#fff;}
.help-tip{font-size:12px;color:#666;}
</style>
</head>
<body class="bg-gray-50 max-w-7xl mx-auto p-5">
<h1 class="text-2xl font-bold text-[#6b21a8] text-center mb-6">FreeSewing风格 在线参数化制版</h1>

<!-- 全局设置 -->
<div class="bg-white rounded-lg shadow p-4 mb-6">
  <div class="flex flex-wrap gap-4 items-center">
    <button class="tab-btn px-4 py-2 rounded-lg bg-[#e8c8d8]" data-tab="pet">宠物服装制版</button>
    <button class="tab-btn px-4 py-2 rounded-lg bg-gray-100" data-tab="bjd">BJD娃衣制版</button>
    <button class="tab-btn px-4 py-2 rounded-lg bg-gray-100" data-tab="women">女装上衣</button>
  </div>
</div>

<!--宠物背心-->
<div class="tab-content active" data-tab="pet">
  <div class="bg-white rounded-lg shadow p-4">
    <h2 class="text-xl mb-3">宠物背心 | 输入尺寸(cm)</h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <label>胸围 <input id="petBust" value="32" class="w-full border rounded p-1 mt-1"></label>
      <label>颈围 <input id="petNeck" value="22" class="w-full border rounded p-1 mt-1"></label>
      <label>背长 <input id="petBack" value="20" class="w-full border rounded p-1 mt-1"></label>
    </div>
    <button onclick="drawPet()" class="w-full mt-3 bg-[#6b21a8] text-white py-2 rounded-lg">更新预览</button>
    <canvas id="petCanvas" width="600" height="500" class="my-4"></canvas>
    <button onclick="exportPetPdf()" class="w-full mt-2 bg-pink-200 py-2 rounded-lg">导出PDF纸样</button>
  </div>
</div>

<!--BJD-->
<div class="tab-content" data-tab="bjd">
  <div class="bg-white rounded-lg shadow p-4">
    <h2 class="text-xl mb-3">BJD连衣裙 |输入尺寸(cm)</h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <label>娃胸围 <input id="bjdBust" value="14" class="w-full border rounded p-1 mt-1"></label>
      <label>娃腰围 <input id="bjdWaist" value="11" class="w-full border rounded p-1 mt-1"></label>
      <label>衣长 <input id="bjdLen" value="16" class="w-full border rounded p-1 mt-1"></label>
    </div>
    <button onclick="drawBjd()" class="w-full mt-3 bg-[#6b21a8] text-white py-2 rounded-lg">更新预览</button>
    <canvas id="bjdCanvas" width="600" height="500" class="my-4"></canvas>
    <button onclick="exportBjdPdf()" class="w-full mt-2 bg-pink-200 py-2 rounded-lg">导出PDF纸样</button>
  </div>
</div>

<!--女装基础上衣-->
<div class="tab-content" data-tab="women">
  <div class="bg-white rounded-lg shadow p-4">
    <h2 class="text-xl mb-3">女装基础上衣 | 输入尺寸(cm)</h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <label>胸围 <input id="wBust" value="84" class="w-full border rounded p-1 mt-1"></label>
      <label>肩宽 <input id="wShoulder" value="38" class="w-full border rounded p-1 mt-1"></label>
      <label>衣长 <input id="wLen" value="55" class="w-full border rounded p-1 mt-1"></label>
    </div>
    <button onclick="drawWomen()" class="w-full mt-3 bg-[#6b21a8] text-white py-2 rounded-lg">更新预览</button>
    <canvas id="wCanvas" width="600" height="500" class="my-4"></canvas>
    <button onclick="exportWPdf()" class="w-full mt-2 bg-pink-200 py-2 rounded-lg">导出PDF纸样</button>
  </div>
</div>

<script>
//标签切换
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('bg-[#e8c8d8]'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('bg-[#e8c8d8]');
    const tabId = btn.dataset.tab;
    document.querySelector(`.tab-content[data-tab="${tabId}"]`).classList.add('active');
  }
})

//宠物绘图
function drawPet(){
  const canvas = document.getElementById('petCanvas');
  const ctx = canvas.getContext("2d");
  const bust = Number(document.getElementById('petBust').value);
  const neck = Number(document.getElementById('petNeck').value);
  const back = Number(document.getElementById('petBack').value);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#b60688";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(100,70);
  ctx.bezierCurveTo(140,50, 200,52, 240,75);
  ctx.bezierCurveTo(280,130,210,240,210,240);
  ctx.bezierCurveTo(180,310,120,300,100,250);
  ctx.closePath();
  ctx.stroke();
}
async function exportPetPdf(){
  const pdf = new jspdf.jsPDF('p','mm','a4');
  const canvas = document.getElementById("petCanvas");
  const img = canvas.toDataURL("image/png");
  pdf.addImage(img, 'PNG',10,10,190,140);
  pdf.save("宠物背心_纸样.pdf");
}

//BJD绘图
function drawBjd(){
  const canvas = document.getElementById('bjdCanvas');
  const ctx = canvas.getContext("2d");
  const bust = Number(document.getElementById('bjdBust').value);
  const waist = Number(document.getElementById('bjdWaist').value);
  const len = Number(document.getElementById('bjdLen').value);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#884470";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(120,60);
  ctx.lineTo(220,70);
  ctx.lineTo(230,220);
  ctx.lineTo(110,250);
  ctx.closePath();
  ctx.stroke();
}
async function exportBjdPdf(){
  const pdf = new jspdf.jsPDF('p','mm','a4');
  const canvas = document.getElementById("bjdCanvas");
  const img = canvas.toDataURL("image/png");
  pdf.addImage(img, 'PNG',10,10,190,160);
  pdf.save("BJD连衣裙_纸样.pdf");
}

//女装绘图
function drawWomen(){
  const canvas = document.getElementById('wCanvas');
  const ctx = canvas.getContext("2d");
  const bust = Number(document.getElementById('wBust').value);
  const shoulder = Number(document.getElementById('wShoulder').value);
  const len = Number(document.getElementById('wLen').value);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#6b21a8";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(100,80);
  ctx.lineTo(270,80);
  ctx.lineTo(320,310);
  ctx.lineTo(50,320);
  ctx.closePath();
  ctx.stroke();
}
async function exportWPdf(){
  const pdf = new jspdf.jsPDF('p','mm','a4');
  const canvas = document.getElementById("wCanvas");
  const img = canvas.toDataURL("image/png");
  pdf.addImage(img, 'PNG',10,10,190,160);
  pdf.save("女装上衣_纸样.pdf");
}

window.onload=function(){
  drawPet();
  drawBjd();
  drawWomen();
}
</script>
</body>
</html>
