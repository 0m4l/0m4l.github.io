<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeSewing纸样生成器｜宠物·BJD·女装上衣</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
.tab-content{display:none;}
.tab-content.active{display:block;}
canvas{border:1px solid #666;background:#fff;max-width:100%;}
.unit-note{color:#666;font-size:0.85rem}
</style>
</head>
<body class="bg-gray-50 max-w-5xl mx-auto p-4">
<h1 class="text-2xl font-bold text-purple-800 text-center my-4">FreeSewing 纸样生成器</h1>

<div class="bg-white rounded-lg shadow p-4 mb-4">
  <div class="flex gap-3 flex-wrap">
    <button class="tab-btn px-4 py-2 rounded-lg bg-purple-200" data-tab="pet">宠物背心制版</button>
    <button class="tab-btn px-4 py-2 rounded-lg bg-gray-200" data-tab="bjd">BJD连衣裙制版</button>
    <button class="tab-btn px-4 py-2 rounded-lg bg-gray-200" data-tab="women">女装上衣原型制版</button>
  </div>
</div>

<!-- ========= 宠物背心 ========= -->
<div class="tab-content active" id="pet">
  <div class="bg-white rounded-lg shadow p-4">
    <h2 class="text-xl mb-2">宠物背心 <span class="unit-note">单位：cm，自带1cm缝份</span></h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <label>胸围 <input id="petBust" value="32" class="w-full border p-1 rounded" type="number" step="0.1"></label>
      <label>颈围 <input id="petNeck" value="22" class="w-full border p-1 rounded" type="number" step="0.1"></label>
      <label>背长 <input id="petBack" value="20" class="w-full border p-1 rounded" type="number" step="0.1"></label>
    </div>
    <button onclick="drawPet()" class="bg-purple-700 text-white px-4 py-2 rounded w-full mb-3">更新预览</button>
    <canvas id="petCanvas" width="600" height="520"></canvas>
    <button onclick="exportPetPdf()" class="bg-pink-200 px-4 py-2 rounded w-full mt-3">导出PDF纸样</button>
  </div>
</div>

<!-- ========= BJD连衣裙 ========= -->
<div class="tab-content" id="bjd">
  <div class="bg-white rounded-lg shadow p-4">
    <h2 class="text-xl mb-2">BJD连衣裙 <span class="unit-note">单位：cm，自带0.5cm缝份</span></h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <label>娃胸围 <input id="bjdBust" value="14" class="w-full border p-1 rounded" type="number" step="0.1"></label>
      <label>娃腰围 <input id="bjdWaist" value="11" class="w-full border p-1 rounded" type="number" step="0.1"></label>
      <label>衣长 <input id="bjdLen" value="16" class="w-full border p-1 rounded" type="number" step="0.1"></label>
      <label>肩宽 <input id="bjdShoulder" value="6.5" class="w-full border p-1 rounded" type="number" step="0.1"></label>
    </div>
    <button onclick="drawBjd()" class="bg-purple-700 text-white px-4 py-2 rounded w-full mb-3">更新预览</button>
    <canvas id="bjdCanvas" width="600" height="520"></canvas>
    <button onclick="exportBjdPdf()" class="bg-pink-200 px-4 py-2 rounded w-full mt-3">导出PDF纸样</button>
  </div>
</div>

<!-- ========= 女装上衣原型 ========= -->
<div class="tab-content" id="women">
  <div class="bg-white rounded-lg shadow p-4">
    <h2 class="text-xl mb-2">女装基础上衣原型 <span class="unit-note">单位：cm，自带1cm缝份</span></h2>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <label>胸围 <input id="wBust" value="84" class="w-full border p-1 rounded" type="number" step="0.1"></label>
      <label>肩宽 <input id="wShoulder" value="38" class="w-full border p-1 rounded" type="number" step="0.1"></label>
      <label>衣长 <input id="wLen" value="55" class="w-full border p-1 rounded" type="number" step="0.1"></label>
      <label>背长 <input id="wBackLen" value="38" class="w-full border p-1 rounded" type="number" step="0.1"></label>
    </div>
    <button onclick="drawWomen()" class="bg-purple-700 text-white px-4 py-2 rounded w-full mb-3">更新预览</button>
    <canvas id="womenCanvas" width="600" height="520"></canvas>
    <button onclick="exportWomenPdf()" class="bg-pink-200 px-4 py-2 rounded w-full mt-3">导出PDF纸样</button>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;
// 标签切换逻辑
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('bg-purple-200'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    btn.classList.add('bg-purple-200');
    document.getElementById(btn.dataset.tab).classList.add('active');
  }
})

// 绘制标尺
function drawRuler(ctx, w, h, scale=1){
  ctx.strokeStyle="#aaa";
  ctx.font="10px sans-serif";
  //底部标尺
  for(let x=0;x<=w;x+=20*scale){
    ctx.beginPath();
    ctx.moveTo(x,h);
    ctx.lineTo(x,h-8);
    ctx.stroke();
    ctx.fillText((x/scale/10).toFixed(1),x+2,h-10);
  }
  //左侧标尺
  for(let y=0;y<=h;y+=20*scale){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(8,y);
    ctx.stroke();
    ctx.fillText((y/scale/10).toFixed(1),10,y-2);
  }
}

// ========== 宠物背心绘制（曲线原型+缝份） ==========
function drawPet(){
  const canvas = document.getElementById("petCanvas");
  const ctx = canvas.getContext("2d");
  const bust = Number(document.getElementById("petBust").value);
  const neck = Number(document.getElementById("petNeck").value);
  const backLen = Number(document.getElementById("petBack").value);
  const scale = 8;
  const seam = 1*scale; //1cm缝份
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawRuler(ctx, canvas.width, canvas.height, scale);

  const halfBust = bust/2 * scale;
  const neckR = neck/(2*Math.PI)*scale;
  const bl = backLen * scale;
  const ox = 80, oy=80;

  //净样线（实线）
  ctx.strokeStyle="#000";
  ctx.beginPath();
  ctx.moveTo(ox,oy);
  ctx.bezierCurveTo(ox+neckR*0.8, oy-neckR, ox+halfBust-neckR*0.8, oy-neckR, ox+halfBust, oy);
  ctx.lineTo(ox+halfBust, oy+bl);
  ctx.bezierCurveTo(ox+halfBust, oy+bl+neckR, ox, oy+bl+neckR, ox, oy+bl);
  ctx.closePath();
  ctx.stroke();

  //缝份线（浅灰虚线）
  ctx.strokeStyle="#888";
  ctx.setLineDash([4,3]);
  ctx.beginPath();
  ctx.moveTo(ox-seam,oy-seam);
  ctx.bezierCurveTo(ox+neckR*0.8-seam, oy-neckR-seam, ox+halfBust-neckR*0.8+seam, oy-neckR-seam, ox+halfBust+seam, oy-seam);
  ctx.lineTo(ox+halfBust+seam, oy+bl+seam);
  ctx.bezierCurveTo(ox+halfBust+seam, oy+bl+neckR+seam, ox-seam, oy+bl+neckR+seam, ox-seam, oy+bl+seam);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);
}

// ========== BJD连衣裙绘制 ==========
function drawBjd(){
  const canvas = document.getElementById("bjdCanvas");
  const ctx = canvas.getContext("2d");
  const bust = Number(document.getElementById("bjdBust").value);
  const waist = Number(document.getElementById("bjdWaist").value);
  const len = Number(document.getElementById("bjdLen").value);
  const shoulder = Number(document.getElementById("bjdShoulder").value);
  const scale =20;
  const seam = 0.5*scale;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawRuler(ctx, canvas.width, canvas.height, scale);

  const ox=100, oy=60;
  const halfBust = bust/2*scale;
  const halfWaist = waist/2*scale;
  const sh = shoulder*scale;
  const l = len*scale;

  ctx.strokeStyle="#000";
  ctx.beginPath();
  ctx.moveTo(ox,oy);
  ctx.lineTo(ox+sh, oy);
  ctx.bezierCurveTo(ox+sh+halfBust*0.3, oy+halfBust*0.2, ox+sh+halfBust*0.5, oy+halfBust*0.4, ox+sh+halfBust*0.5, oy + l*0.4);
  ctx.bezierCurveTo(ox+sh+halfWaist*0.5, oy+l*0.6, ox+sh*0.5, oy+l, ox, oy+l);
  ctx.closePath();
  ctx.stroke();

  //缝份虚线
  ctx.strokeStyle="#888";
  ctx.setLineDash([4,3]);
  ctx.beginPath();
  ctx.moveTo(ox-seam,oy-seam);
  ctx.lineTo(ox+sh+seam, oy-seam);
  ctx.bezierCurveTo(ox+sh+halfBust*0.3+seam, oy+halfBust*0.2-seam, ox+sh+halfBust*0.5+seam, oy+halfBust*0.4, ox+sh+halfBust*0.5+seam, oy + l*0.4+seam);
  ctx.bezierCurveTo(ox+sh+halfWaist*0.5+seam, oy+l*0.6+seam, ox+sh*0.5-seam, oy+l+seam, ox-seam, oy+l+seam);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);
}

// ========== 女装上衣原型 ==========
function drawWomen(){
  const canvas = document.getElementById("womenCanvas");
  const ctx = canvas.getContext("2d");
  const bust = Number(document.getElementById("wBust").value);
  const shoulder = Number(document.getElementById("wShoulder").value);
  const len = Number(document.getElementById("wLen").value);
  const backLen = Number(document.getElementById("wBackLen").value);
  const scale=3;
  const seam=1*scale;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawRuler(ctx, canvas.width, canvas.height, scale);

  const ox=120, oy=70;
  const halfBust = bust/2*scale;
  const sh = shoulder/2*scale;
  const l = len*scale;

  ctx.strokeStyle="#000";
  ctx.beginPath();
  ctx.moveTo(ox,oy);
  ctx.lineTo(ox+sh, oy);
  ctx.lineTo(ox+sh+halfBust*0.4, oy+backLen*0.6);
  ctx.lineTo(ox+sh*0.8, oy+l);
  ctx.lineTo(ox, oy+l);
  ctx.closePath();
  ctx.stroke();

  //缝份虚线
  ctx.strokeStyle="#888";
  ctx.setLineDash([4,3]);
  ctx.beginPath();
  ctx.moveTo(ox-seam,oy-seam);
  ctx.lineTo(ox+sh+seam, oy-seam);
  ctx.lineTo(ox+sh+halfBust*0.4+seam, oy+backLen*0.6+seam);
  ctx.lineTo(ox+sh*0.8-seam, oy+l+seam);
  ctx.lineTo(ox-seam, oy+l+seam);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);
}

// ========= PDF导出函数 =========
async function exportPetPdf(){
  const canvas = document.getElementById("petCanvas");
  const pdf = new jsPDF('p','mm','a4');
  const img = canvas.toDataURL("image/png");
  pdf.addImage(img, 'PNG',10,10,190,140);
  pdf.save("宠物背心_FreeSewing原型纸样.pdf");
}
async function exportBjdPdf(){
  const canvas = document.getElementById("bjdCanvas");
  const pdf = new jsPDF('p','mm','a4');
  const img = canvas.toDataURL("image/png");
  pdf.addImage(img, 'PNG',10,10,190,140);
  pdf.save("BJD连衣裙_FreeSewing原型纸样.pdf");
}
async function exportWomenPdf(){
  const canvas = document.getElementById("womenCanvas");
  const pdf = new jsPDF('p','mm','a4');
  const img = canvas.toDataURL("image/png");
  pdf.addImage(img, 'PNG',10,10,190,140);
  pdf.save("女装上衣_FreeSewing原型纸样.pdf");
}

window.onload = function(){
  drawPet(); drawBjd(); drawWomen();
}
</script>
</body>
</html>
